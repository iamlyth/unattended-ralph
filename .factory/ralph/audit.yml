# Independent read-only-production audit for a completed campaign round.
cli:
  backend: "pi"
  command: "./scripts/pi2-ollama.sh"

event_loop:
  prompt_file: ".factory/prompts/audit.md"
  completion_promise: "AUDIT_COMPLETE"
  starting_event: "factory.audit"
  max_iterations: 20
  max_runtime_seconds: 31536000

core:
  scratchpad: ".ralph/agent/scratchpad.md"
  specs_dir: "docs/"

features:
  parallel: false
  auto_merge: false

hats:
  auditor:
    name: "Factory Independent Auditor"
    description: "Adversarial production-path and evidence reviewer."
    triggers: ["factory.audit"]
    publishes: ["factory.audit"]
    default_publishes: "factory.audit"
    instructions: |
      Follow .factory/prompts/audit.md exactly. Coordinate only read-only Pi subagents.
      Write only .factory/artifacts/campaign-audit.md and the recovery scratchpad. Never place
      AUDIT_COMPLETE in an event payload; completion requires that exact token
      alone as the final line outside events.

hooks:
  enabled: true
  defaults:
    timeout_seconds: 30
  events:
    pre.iteration.start:
      - name: branch-guard
        command: ["./scripts/branch-guard.sh"]
        on_error: block
    post.iteration.start:
      - name: campaign-audit-scope
        command: ["./scripts/campaign-audit-scope-guard.sh"]
        on_error: block
      - name: campaign-audit-environment
        command: ["./scripts/check-factory-environment.py"]
        on_error: block
      - name: campaign-audit-scratchpad
        command: ["./scripts/check-scratchpad.sh", "AUDIT_COMPLETE", "--allow-missing", "--allow-oversize"]
        on_error: block
      - name: campaign-audit-checkpoint
        command: ["./scripts/git-commit-hook.sh", "--campaign-audit"]
        on_error: block
      - name: ollama-usage-wait
        command: ["./scripts/ollama-usage-guard.sh", "--wait"]
        timeout_seconds: 691200
        on_error: block
    pre.loop.complete:
      - name: final-campaign-audit-checkpoint
        command: ["./scripts/git-commit-hook.sh", "--campaign-audit", "--final-handoff"]
        on_error: block
      - name: final-campaign-audit-gate
        command: ["./scripts/ralph-completion-gate.sh", "campaign-audit"]
        on_error: block
