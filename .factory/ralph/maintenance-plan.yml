# One-bug maintenance planning loop; one repository writer.
cli:
  backend: "pi"
  command: "./scripts/pi2-ollama.sh"

event_loop:
  prompt_file: ".factory/prompts/maintenance-plan.md"
  completion_promise: "MAINTENANCE_PLAN_COMPLETE"
  starting_event: "factory.maintenance.plan"
  max_iterations: 20
  max_runtime_seconds: 31536000

core:
  scratchpad: ".ralph/agent/scratchpad.md"
  specs_dir: "docs/"

features:
  parallel: false
  auto_merge: false

hats:
  maintenance_planner:
    name: "Maintenance Planner"
    description: "Plan one selected ordinary defect without changing the product or spec."
    triggers: ["factory.maintenance.plan"]
    publishes: ["factory.maintenance.plan"]
    default_publishes: "factory.maintenance.plan"
    instructions: |
      Follow .factory/prompts/maintenance-plan.md. You are the sole writer; subagents are
      read-only. Write only .factory/artifacts/maintenance-plan.md and the recovery scratchpad.
      Preserve launcher metadata. Never place MAINTENANCE_PLAN_COMPLETE in an event
      payload; completion requires that exact token alone as the final line outside events.

hooks:
  enabled: true
  defaults:
    timeout_seconds: 30
  events:
    pre.iteration.start:
      - name: branch-guard
        command: ["./scripts/branch-guard.sh"]
        on_error: block
    post.iteration.start:
      - name: maintenance-planning-scope
        command: ["./scripts/maintenance-plan-scope-guard.sh"]
        on_error: block
      - name: maintenance-planning-freshness
        command: ["./scripts/check-maintenance-freshness.sh", "--planning"]
        on_error: block
      - name: maintenance-planning-scratchpad
        command: ["./scripts/check-scratchpad.sh", "--allow-missing", "--allow-oversize"]
        on_error: block
      - name: maintenance-planning-checkpoint
        command: ["./scripts/git-commit-hook.sh", "--maintenance-plan"]
        on_error: block
      - name: ollama-usage-wait
        command: ["./scripts/ollama-usage-guard.sh", "--wait"]
        timeout_seconds: 691200
        on_error: block
    pre.loop.complete:
      - name: final-maintenance-planning-gate
        command: ["./scripts/ralph-completion-gate.sh", "maintenance-planning"]
        on_error: block
      - name: final-maintenance-planning-checkpoint
        command: ["./scripts/git-commit-hook.sh", "--maintenance-plan"]
        on_error: block
