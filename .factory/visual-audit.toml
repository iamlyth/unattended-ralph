# Optional machine-audit product (generic boilerplate scaffold).
#
# Product-neutral template, disabled by default. A consumer may enable it
# only after it has (1) configured a vision model in `vision_model` (default
# empty: the generic scaffold never assumes or defaults a provider/model),
# (2) implemented an installed exact-commit capture driver at
# scripts/visual-capture-driver.sh (the scaffold adapter fails closed until
# then), (3) replaced the placeholder inventory and calibration templates
# with consumer visual states, and (4) proven a real non-skipping image
# round-trip with scripts/visual-audit-probe.sh. Captures are exact-commit
# installed production windows, serial and isolated, under the dedicated
# lease. Every untrusted capture driver and the vision model run in their
# own process session/group under hard configured timeouts: on timeout the
# whole group is TERM'd, given the bounded cleanup grace, then KILL'd and
# reaped, and any partial/invalid image is removed; no global pkill and no
# display assumptions exist in this generic layer. All mutable
# capture/review/calibration/probe state lives under the ignored
# .factory-state/visual-audit/ directory.
schema_version = 1

[visual-audit]
enabled = false
vision_model = ""
sdk_driver = "scripts/visual-audit-review-sdk.mjs"
lease_file = ".factory-state/visual-audit/lease"
review_parallelism = 4
review_timeout_seconds = 300
# Per-state capture driver hard timeout (seconds, default 120, ceiling 120).
# The untrusted capture driver runs in its own process session/group; on
# timeout the whole group receives SIGTERM, then after the bounded cleanup
# grace SIGKILL, and is waited/reaped. The partial image is removed.
capture_timeout_seconds = 120
# Bounded grace (seconds, default 5, ceiling 5) between TERM and KILL.
capture_cleanup_grace_seconds = 5
capture_driver = "scripts/visual-capture-driver.sh"
capture_dir = ".factory-state/visual-audit/captures"
review_dir = ".factory-state/visual-audit/reviews"
prompt_template = ".factory/prompts/visual-audit.md"
review_schema = ".factory/schemas/visual-audit-review.schema.json"
calibration_set = ".factory/visual-audit-calibration.json"
inventory = ".factory/visual-audit-inventory.json"
# Durable 0600 receipts (atomic write) under the ignored mutable state dir:
# the probe receipt records a real non-skipping image round-trip and is
# required before calibration; the calibration receipt records every control
# image hash/result and is required before every live `run`.
calibration_receipt = ".factory-state/visual-audit/calibration-receipt.json"
probe_receipt = ".factory-state/visual-audit/probe-receipt.json"
probe_finding = ".factory-state/visual-audit/probe-finding.json"
