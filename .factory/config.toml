[project]
spec = "docs/SPEC.md"
plan = ".factory/artifacts/implementation-plan.md"
development_branch = "develop"
release_branch = "main"

[verification]
command = ["./scripts/verify.sh"]
clean = ["build"]
build_command = "rm -rf build && cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug && cmake --build build -j$(nproc)"

[harness]
# The agent CLI command used for subagent invocations.
# "pi2" = pi2 coding agent (default, cloud providers)
# "pi"  = pi coding agent (offline, local models)
# Future: "claude", "codex", "antigravity"
command = "pi2"

[campaign]
default_rounds = 20
default_attempts = 3
default_timeout = 259200
max_repairs = 3
stale_rounds = 3
escalation_threshold = 3

[git]
checkpoint_each_iteration = true