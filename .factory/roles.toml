# .factory/roles.toml — Parallel role structure for the factory harness.
#
# This file defines the subagents that run in each campaign phase.  The
# harness reads it at startup and launches subagents accordingly.  Projects
# can add, remove, or modify entries to tailor the process.
#
# Three phases exist:
#   1. planning   — study subagents analyse the codebase in parallel, then
#                   a single planner synthesises their reports into a plan.
#   2. implementation — developers work on isolated codebase areas in
#                       parallel, then an integration developer merges
#                       their proposed changes and commits.
#   3. audit      — specialist auditors review the final codebase in
#                   parallel, each focusing on a different quality axis.
#
# Subagent fields:
#   name        — short identifier used in logs and report headers
#   prompt      — path to the prompt file (relative to repo root)
#   description — human-readable summary of what the subagent does
#   path        — (optional) for study subagents: source directory to focus on
#   paths       — (optional) for developers: list of directories the dev owns
#   model       — (optional) model override for this subagent.  If absent,
#                 the CLI --model argument is used.  Study subagents and
#                 auditors can use cheaper/faster models (read-only, focused
#                 tasks); the planner and integration developer should use
#                 the strongest model (they synthesize and make decisions).
#   timeout     — (optional) per-subagent timeout override (seconds)
#
# Phase-level model overrides:
#   planner_model      — model for the planner (strong model recommended)
#   integration_model  — model for the integration developer (strong model)
#
# If no [[planning.studies]] entries have a `path` field, the harness will
# auto-discover subsystems by scanning the source tree and generate one
# study subagent per major directory.
#
# Round-adaptive role selection:
#   The planner may emit a `roles_override` field in the plan's YAML front
#   matter (JSON-encoded) to adjust roles for the next round.  Supported
#   keys: skip_auditors, skip_studies, add_auditors, add_studies,
#   add_developers, auditor_models, study_models, developer_models,
#   planner_model.  See docs/FACTORY-LOOP-SPEC.md §4.6.

# ─── Planning phase ───────────────────────────────────────────────────

[planning]
planner_prompt = ".factory/prompts/planner.md"
# Timeout for each study subagent and the planner (seconds).
timeout = 3600

[[planning.studies]]
name = "spec"
prompt = ".factory/prompts/study-spec.md"
description = "Study the project specification and requirements"

[[planning.studies]]
name = "architecture"
prompt = ".factory/prompts/study-architecture.md"
description = "Study the overall codebase architecture and module layout"

[[planning.studies]]
name = "bugs"
prompt = ".factory/prompts/study-bugs.md"
description = "Study current bugs, test failures, and known issues"

# Subsystem studies are auto-generated from the source tree.
# To override with explicit subsystems, uncomment and edit:
# [[planning.studies]]
# name = "manager"
# prompt = ".factory/prompts/study-subsystem.md"
# path = "src/manager/"
# description = "Study the manager UI and event loop"

# ─── Implementation phase ─────────────────────────────────────────────
#
# MULTI-APPROACH DEVELOPER PATTERN
# Multiple developers independently attempt the same task from different
# directions. The integration developer evaluates all proposals and
# selects the best one (or merges the best parts). With cheap models like
# deepseek-v4.1-flash, running 2-4 parallel approaches costs almost nothing
# and significantly improves quality through competition.
#
# To control how many approaches run: add or remove [[implementation.developers]]
# entries below. Each entry is one independent attempt.
#
# Available approach prompts:
#   developer-a.md — Minimal and direct (least code, simple solutions)
#   developer-b.md — Robust and defensive (edge cases, input validation)
#   developer-c.md — Test-driven (specification-first, tests prove correctness)
#   developer-d.md — Refactor and reuse (study existing code, improve as you go)
#
# To add more approaches, create developer-e.md, developer-f.md, etc.
# To use a single developer (old behavior), comment out all entries and
# uncomment the default developer below.

[implementation]
integration_prompt = ".factory/prompts/integration-developer.md"
integration_model = "gpt-6-astra"
integration_provider = "openai-codex"
timeout = 3600

[[implementation.developers]]
name = "approach-a"
prompt = ".factory/prompts/developer-a.md"
description = "Minimal and direct implementation approach"
model = "deepseek-v4.1-flash"
provider = "ollama-cloud"

[[implementation.developers]]
name = "approach-b"
prompt = ".factory/prompts/developer-b.md"
description = "Robust and defensive implementation approach"
model = "gpt-5.6-luna"
provider = "openai-codex"

[[implementation.developers]]
name = "approach-c"
prompt = ".factory/prompts/developer-c.md"
description = "Test-driven, specification-first approach"
model = "gpt-5.6-luna"
provider = "openai-codex"

[[implementation.developers]]
name = "approach-d"
prompt = ".factory/prompts/developer-d.md"
description = "Refactor and reuse existing patterns"
model = "deepseek-v4.1-flash"
provider = "ollama-cloud"

# Single developer (old behavior, no ensemble):
# [[implementation.developers]]
# name = "default"
# prompt = ".factory/prompts/developer.md"
# description = "Full-stack developer for the entire codebase"

# ─── Audit phase ──────────────────────────────────────────────────────

[audit]
timeout = 3600

[[audit.auditors]]
name = "linting"
prompt = ".factory/prompts/auditor-linting.md"
description = "Language linting, readability, concise comments (no verbose noise)"
model = "glm-5.3"

[[audit.auditors]]
name = "efficiency"
prompt = ".factory/prompts/auditor-efficiency.md"
description = "Performance, resource usage, algorithmic complexity"
model = "glm-5.3"

[[audit.auditors]]
name = "security"
prompt = ".factory/prompts/auditor-security.md"
description = "Security vulnerabilities, attack surface, input validation"
model = "glm-5.3"

[[audit.auditors]]
name = "functional"
prompt = ".factory/prompts/auditor-functional.md"
description = "Functional correctness — does the code actually work"
model = "glm-5.3"

[[audit.auditors]]
name = "spec-compliance"
prompt = ".factory/prompts/auditor-spec.md"
description = "Compliance with the project specification"
model = "glm-5.3"

[[audit.auditors]]
name = "readability"
prompt = ".factory/prompts/auditor-readability.md"
description = "Human readability, natural code flow, clear naming and structure"
model = "glm-5.3"

[[audit.auditors]]
name = "simplifier"
prompt = ".factory/prompts/auditor-simplifier.md"
description = "Code complexity reduction, dead code, duplication, over-engineering"
model = "glm-5.3"

[[audit.auditors]]
name = "compatibility"
prompt = ".factory/prompts/auditor-compatibility.md"
description = "Platform, dependency, and API compatibility"
model = "glm-5.3"