# One-bug maintenance implementation loop; one repository writer.
cli:
  backend: "pi"
  command: "./scripts/pi2-ollama.sh"

event_loop:
  prompt_file: "prompts/MAINTENANCE.md"
  completion_promise: "MAINTENANCE_COMPLETE"
  starting_event: "factory.maintenance.implement"
  max_iterations: 1000
  max_runtime_seconds: 31536000

core:
  scratchpad: ".ralph/agent/scratchpad.md"
  specs_dir: "docs/"

features:
  parallel: false
  auto_merge: false

hats:
  maintenance_worker:
    name: "Maintenance Worker"
    description: "Implement one selected ordinary defect with one repository writer."
    triggers: ["factory.maintenance.implement"]
    publishes: ["factory.maintenance.implement"]
    default_publishes: "factory.maintenance.implement"
    instructions: |
      Follow prompts/MAINTENANCE.md. Complete one bounded ready task per context.
      You are the sole writer; all Pi subagents remain read-only. Never place
      MAINTENANCE_COMPLETE in an event payload; completion requires that exact token
      alone as the final line outside events.

hooks:
  enabled: true
  defaults:
    timeout_seconds: 30
  events:
    pre.iteration.start:
      - name: branch-guard
        command: ["./scripts/branch-guard.sh"]
        on_error: block
      - name: maintenance-freshness
        command: ["./scripts/check-maintenance-freshness.sh"]
        on_error: block
    post.iteration.start:
      - name: protect-maintenance-contract
        command: ["./scripts/check-maintenance-freshness.sh"]
        on_error: block
      - name: maintenance-scratchpad
        command: ["./scripts/check-scratchpad.sh", "MAINTENANCE_COMPLETE", "--allow-missing"]
        on_error: block
      - name: maintenance-checkpoint
        command: ["./scripts/git-commit-hook.sh", "--maintenance"]
        on_error: block
      - name: ollama-usage-wait
        command: ["./scripts/ollama-usage-guard.sh", "--wait"]
        timeout_seconds: 691200
        on_error: block
    pre.loop.complete:
      - name: final-maintenance-gate
        command: ["./scripts/ralph-completion-gate.sh", "maintenance"]
        timeout_seconds: 3600
        on_error: block
      - name: final-maintenance-checkpoint
        command: ["./scripts/git-commit-hook.sh", "--maintenance"]
        on_error: block
